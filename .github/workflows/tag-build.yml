name: Build tagged APK

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Build APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Package APK and sources
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          artifact_tag=$(printf '%s' "$TAG_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DriveTrace-${artifact_tag}-debug.apk"
          git archive --format=zip --prefix="DriveTrace-${artifact_tag}/" \
            --output="dist/DriveTrace-${artifact_tag}-sources.zip" HEAD

      - name: Upload APK and sources
        uses: actions/upload-artifact@v7
        with:
          name: DriveTrace-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
